<style>
:root{
  --ink:#1D2B4F; --muted:#56637F; --card:#FFFFFF; --edge:#D5DDEB;
  --red:#E5483F; --yellow:#E9A20F; --green:#1F9A5E; --blue:#2E78D0; --purple:#8657D3; --orange:#EA6C1F; --teal:#168C99; --pink:#D13F7A; --indigo:#4F5BD5; --steel:#4E6E91;
  --parch:#FBF3E0; --parch-edge:#E3D3AE; --gold:#F2B233;
  --sky:#CFE8F7; --ground:#8CC56B;
  --panel:#FFFFFF; --panel-2:#F2F6FB; --line:#DCE3EE; --ok:#1F9A5E;
  --num:"Andika","Andika New Basic","Trebuchet MS",system-ui,sans-serif;
  --ui:"Fredoka","Andika",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#162030; --panel-2:#1D2A3D; --line:#2B3950; --ok:#3BC07F; --pink-ink:#EAF2FF; }
  :root:not([data-theme="light"]) #parent{ color:#EAF2FF }
}
:root[data-theme="dark"]{ --panel:#162030; --panel-2:#1D2A3D; --line:#2B3950; --ok:#3BC07F }
:root[data-theme="dark"] #parent{ color:#EAF2FF }
body.digits-school .num{font-feature-settings:"cv01","cv04"}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%}
body{
  height:100%; margin:0; overflow:hidden; color:var(--ink); font-family:var(--ui);
  background:linear-gradient(to bottom, var(--sky) 50%, var(--ground) 50%);
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  touch-action:manipulation; overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;
  top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px)}
.screen.on{display:flex}
.num{font-family:var(--num)}

/* ---------- start ---------- */
#start{align-items:center;justify-content:center;gap:28px;text-align:center;padding:24px;background:var(--sky)}
.logo{display:flex;align-items:center;gap:18px}
.logo svg{width:clamp(64px,12vw,110px);height:auto}
.logo h1{margin:0;font:600 clamp(40px,8vw,78px)/1 var(--ui);color:var(--ink)}
.bigplay{
  width:clamp(120px,26vw,170px);aspect-ratio:1;border-radius:50%;border:0;background:var(--red);color:#fff;
  box-shadow:0 10px 0 #B8342D;display:grid;place-items:center;transition:transform .08s,box-shadow .08s;
}
.bigplay:active{transform:translateY(8px);box-shadow:0 2px 0 #B8342D}
.bigplay svg{width:46%;height:46%;margin-left:8%}
.hint{color:var(--muted);font-size:16px;max-width:34ch;line-height:1.4}

/* ---------- home ---------- */
#home{padding:16px;background:var(--sky)}
.topbar{display:flex;justify-content:flex-end;align-items:center;min-height:56px}
.gear{position:relative;width:52px;height:52px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.gear svg{width:28px;height:28px}
.gear .ring{position:absolute;inset:2px;border-radius:50%;
  background:conic-gradient(var(--muted) calc(var(--p,0)*1turn), transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));}
.gear-tip{position:absolute;right:62px;white-space:nowrap;font-size:14px;color:var(--muted);opacity:0;transition:opacity .2s;pointer-events:none}
.gear-tip.show{opacity:1}
.profiles{flex:1;display:flex;flex-wrap:wrap;gap:clamp(18px,4vw,36px);align-content:center;justify-content:center;padding:8px 0 24px}
.profiles.locked .prof{opacity:.45;filter:grayscale(.7)}
.prof{
  width:clamp(190px,30vw,260px);border:0;border-radius:32px;background:var(--card);color:var(--ink);
  box-shadow:0 10px 0 var(--edge),0 16px 26px rgba(20,40,80,.14);padding:18px 16px 20px;
  display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .08s, box-shadow .08s;
}
.prof:active{transform:translateY(8px);box-shadow:0 2px 0 var(--edge)}
.avatar{position:relative;width:68%;aspect-ratio:1;border-radius:50%;background:var(--c);overflow:hidden}
.avatar svg{position:absolute;left:0;bottom:-4%;width:100%;height:auto}
.avwrap{position:relative;width:100%;display:flex;justify-content:center}
.avwrap .go{position:absolute;right:12%;bottom:-2%;width:28%;aspect-ratio:1;border-radius:50%;background:var(--yellow);display:grid;place-items:center;border:5px solid var(--card)}
.avwrap .go svg{width:46%;height:46%;margin-left:10%;color:#fff}
.pname{font:600 clamp(20px,3.2vw,27px)/1.1 var(--ui);min-height:1.1em}
.pwhere{font:500 15px/1.2 var(--ui);color:var(--muted)}
.pdots{display:flex;gap:5px}
.pdots i{width:11px;height:11px;border-radius:50%;background:#E3E8F2}
.pdots i.on{background:var(--yellow)}

/* ---------- play (the stage) ---------- */
#play{overflow:hidden;overflow:clip;background:var(--sky)}
/* the stage is 1180 × 820; the scenery carries on past its sides to the screen edges (--ex is how far, in stage pixels) */
#stage{position:absolute;left:0;top:0;width:1180px;height:820px;transform-origin:0 0}
.lay{position:absolute;left:-1180px;top:0;width:5900px;will-change:transform}
.lay svg{display:block}
#placeWrap,#placeNext{position:absolute;left:560px;top:140px;width:620px;height:460px;will-change:transform}
#placeWrap.dim .pl{opacity:.3}
#placeWrap.dim #guards,#placeWrap.dim #sp{opacity:0}
#guards,#sp{transition:opacity .3s}
.pl{transition:opacity .3s}
#placeWrap.camp{left:0;top:0;width:1180px;height:820px}
.pl-body{transition:opacity .3s}
#party{position:absolute;left:0;top:0;width:560px;height:820px;will-change:transform}
.fig{position:absolute;transform-origin:50% 100%}
.walk .fig .bob{animation:bob .42s ease-in-out infinite alternate}
.walk .fig:nth-child(2n) .bob{animation-delay:.21s}
@keyframes bob{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-7px) rotate(1.5deg)}}
.fig .bob{transform-origin:50% 100%}
.fig.talk .bob{animation:talk .3s ease-in-out infinite alternate}
@keyframes talk{from{transform:translateY(0)}to{transform:translateY(-5px) scale(1.02)}}
.fig.lit .bob{filter:drop-shadow(0 0 10px #F6D36B)}
/* number discs: gold over our army, red over the enemy; they fade while a task is up */
.disc{position:absolute;width:72px;height:72px;pointer-events:none;z-index:25;transition:opacity .3s}
.disc svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 3px rgba(29,43,79,.22))}
#stage.tasking .disc{opacity:0}
.disc .bob{animation:float 1.8s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-6px)}}
.disc.hop .bob{animation:hop .36s ease-in-out infinite alternate}
.disc .face.pop{animation:pop .55s}
.disc .face.big{animation:big 1.6s ease-in-out}
@keyframes big{30%,70%{transform:scale(1.6) translateY(-30px)}}
.badge{position:absolute;min-width:44px;height:44px;padding:0 8px;border-radius:22px;background:var(--yellow);color:#fff;display:grid;place-items:center;
  font:700 28px/1 var(--num);box-shadow:0 4px 0 #B97F06;animation:pop .35s;pointer-events:none;z-index:6}
#things{position:absolute;left:0;top:0;width:1180px;height:820px;pointer-events:none}
#things .thing{transition:transform .25s,filter .25s}
#things .thing.lit{filter:drop-shadow(0 0 8px #F6D36B) brightness(1.08)}
#things .glowspot{opacity:.55}
.side{position:absolute;border-radius:30px;border:5px dashed rgba(29,43,79,.28);background:rgba(255,255,255,.72);padding:0;touch-action:none;-webkit-touch-callout:none}
.side:active{transform:scale(.98)}
.side.win{border-style:solid;border-color:var(--yellow);background:rgba(233,162,15,.18);animation:pop .55s}
.side.hint{border-style:solid;border-color:var(--yellow);animation:nudge 1.1s ease-in-out infinite}
.side.glow{box-shadow:0 0 0 6px #F6D36B,0 0 30px 10px rgba(246,211,107,.8)}
.side.wiggle{animation:wiggle .45s}
.side > svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#fx{position:absolute;inset:0;pointer-events:none}
#homeBtn{left:calc(18px - var(--ex, 0px))}
#ui{position:absolute;inset:0;pointer-events:none}
#ui button{pointer-events:auto}
.round-btn{position:absolute;left:18px;top:14px;width:60px;height:60px;border-radius:50%;border:0;background:var(--card);box-shadow:0 5px 0 var(--edge);display:grid;place-items:center;color:var(--ink);padding:0}
.round-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.round-btn svg{width:30px;height:30px}
.speak{position:absolute;left:540px;top:12px;width:100px;height:64px;border:0;border-radius:32px;background:var(--yellow);
  box-shadow:0 6px 0 #B97F06;display:grid;place-items:center;padding:0}
.speak:active{transform:translateY(5px);box-shadow:0 1px 0 #B97F06}
.speak svg{width:42px;height:42px}
.speak.talking svg .w{animation:wave .6s ease-in-out infinite alternate}
@keyframes wave{from{opacity:.3}to{opacity:1}}
.pips{position:absolute;right:calc(22px - var(--ex, 0px));top:26px;display:flex;gap:8px;pointer-events:none}
.pips svg{width:30px;height:30px;color:rgba(29,43,79,.16)}
.pips svg.lit{color:var(--yellow);animation:pop .4s}
.road{position:absolute;left:290px;top:92px;width:600px;height:40px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.road::before{content:"";position:absolute;left:14px;right:14px;top:18px;height:4px;border-radius:2px;background:rgba(29,43,79,.15)}
.road:empty{display:none}
.road .st{position:relative;width:30px;height:30px;border-radius:50%;background:#fff;opacity:.7;display:grid;place-items:center}
.road .st svg{width:17px;height:17px}
.road .st.done{opacity:1;background:#fff}
.road .st.done::after{content:"";position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid #fff}
.road .st.cur{width:40px;height:40px;opacity:1;box-shadow:0 0 0 4px var(--banner,#E5483F)}
.road .st.cur svg{width:22px;height:22px}
.road .st.camp{background:none;width:24px;height:24px}
.road .st.camp svg{width:20px;height:20px}
.caption{position:absolute;left:290px;top:146px;width:600px;padding:12px 20px 12px 16px;background:var(--parch);border-radius:18px;box-shadow:0 4px 0 var(--parch-edge);
  display:flex;gap:12px;align-items:center;border:0;text-align:left;color:var(--ink);opacity:0;transform:translateY(-8px);transition:opacity .3s,transform .3s;pointer-events:none}
.caption.show{opacity:1;transform:none;pointer-events:auto}
.caption svg{width:28px;height:28px;flex:none}
.caption p{margin:0;font:500 21px/1.3 var(--ui)}
.cards{position:absolute;left:0;right:0;top:622px;height:198px;display:flex;justify-content:center;align-items:flex-start;gap:36px;pointer-events:none}
.card{position:relative;width:150px;height:190px;border:0;padding:0;background:none;pointer-events:auto;transition:opacity .3s,transform .08s;touch-action:none;-webkit-touch-callout:none}
.card svg{width:100%;height:100%;overflow:visible;display:block}
.card:active{transform:scale(.95)}
.card.in{animation:rise .35s ease-out backwards}
@keyframes rise{from{transform:translateY(60px);opacity:0}}
.card.win{animation:pop .55s;z-index:2}
.card.win svg{filter:drop-shadow(0 0 14px rgba(31,154,94,.6))}
.card.dim{opacity:.28}
.card.out{opacity:.14;pointer-events:none}
.card.hint{animation:nudge 1.1s ease-in-out infinite;z-index:1}
.card.hint .rim{stroke:var(--yellow);stroke-width:9}
.card.glow svg{filter:drop-shadow(0 0 16px #F6D36B) drop-shadow(0 0 6px #F6D36B)}
.card.wiggle{animation:wiggle .45s}
.card .dots{transition:opacity .3s}
@keyframes nudge{50%{transform:scale(1.08)}}
@keyframes wiggle{20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}70%{transform:scale(.96)}100%{transform:scale(1)}}
.bigbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.treasure-pop{position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 8px rgba(246,211,107,.7),0 12px 30px rgba(0,0,0,.2);
  display:grid;place-items:center;animation:pop .6s}
.treasure-pop svg{width:78%;height:78%}
.brawl{position:absolute;width:580px;height:380px;z-index:40}
.brawl svg{width:100%;height:100%;overflow:visible}
.brawl .dp{animation:puff .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
.brawl .dp:nth-child(2n){animation-delay:.17s}
/* winners cheer (hop), goblins bob as they run */
.cheer .fig .bob{animation:hop .36s ease-in-out infinite alternate}
.cheer .fig:nth-child(2n) .bob{animation-delay:.18s}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-26px)}}
.fig.hurry .bob{animation:bob .3s ease-in-out infinite alternate}
.gob.run{animation:gobrun .2s ease-in-out infinite alternate}
@keyframes gobrun{to{transform:translateY(-16px)}}
.gob.hop{animation:gobhop .32s ease-in-out infinite alternate}
@keyframes gobhop{to{transform:translateY(-46px)}}
@keyframes puff{to{transform:scale(1.08)}}
.star-fly{position:absolute;width:34px;height:34px;color:var(--yellow);animation:fly .9s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) rotate(0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(260deg) scale(1);opacity:0}}
.drop{transition:transform .5s cubic-bezier(.5,0,1,.5)!important}
.shake{animation:wiggle .45s}
.flagup{animation:flagup .8s ease-out forwards}
@keyframes flagup{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}

/* ---------- arc 2 ---------- */
/* trolls: muddled by a right answer (a "?"), or bonked by a nut in Trolltree Hills */
.gob.troll .huh,.gob.troll .dizzy{transition:opacity .3s}
.gob.puzzled .huh,.gob.bonked .dizzy{opacity:1!important}
.gob.puzzled{animation:puzzled 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes puzzled{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.gob.bonked{animation:bonked .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bonked{from{transform:scaleY(.9) rotate(-3deg)}to{transform:scaleY(.88) rotate(3deg)}}
.nutfall{position:absolute;top:0;width:40px;height:44px;z-index:30;pointer-events:none}
.nutfall svg{width:100%;height:100%;overflow:visible}
/* the messenger's pony gallops */
.messenger{position:absolute;left:760px;top:412px;z-index:22;pointer-events:none}
.messenger.gallop .bob{animation:gallop .22s ease-in-out infinite alternate}
@keyframes gallop{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-12px) rotate(2deg)}}
/* crystals in the Echo Cave light up one by one */
#sp .unlit{filter:brightness(.5) saturate(.4)}
#sp .shine{filter:drop-shadow(0 0 10px #BFF3FF) drop-shadow(0 0 4px #fff) brightness(1.15)}
/* signposts and numbered stones as answer cards; banners that turn face down for "look closely" */
.card .back{display:none}
.card.down .back{display:inline}
.card.down .front{display:none}
.card.flip svg{animation:flipcard .34s ease-in-out}
@keyframes flipcard{50%{transform:scaleX(.04)}}
.cards.tight{gap:16px}
/* numbered stones in the scene, and the hero hopping along them */
#things .stone{transition:filter .25s}
#things .stone.lit{filter:drop-shadow(0 0 9px #F6D36B)}
#things .stone.lit .top{fill:#F3E3AE}
#things .stone.blank .q{animation:qpulse 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes qpulse{50%{transform:scale(1.18)}}
.hopper{position:absolute;left:0;top:0;width:80px;height:80px;z-index:8;pointer-events:none}
.hopper svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 3px rgba(29,43,79,.25))}
/* "which number is bigger?": two trolls hold up shields; no box round them until it matters */
.side.bare{border-color:transparent;background:none}
.side.bare.win,.side.bare.hint{border-color:var(--yellow);background:rgba(233,162,15,.12)}
.side .sh{transition:transform .4s;transform-box:fill-box;transform-origin:50% 60%}
.side.bare.win .sh{transform:scale(1.14)}
.side .sh .n2,.side .sh .dots{opacity:0;transition:opacity .3s}
.side.dotted .sh .n1{opacity:0}
.side.dotted .sh .n2,.side.dotted .sh .dots{opacity:1}
.side .dots circle.on{fill:#E9A20F}

/* ---------- celebrate ---------- */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- parent panel (as Letter Hunt) ---------- */
#parent{background:var(--panel-2);z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:text;user-select:text;color:#1D2B4F}
.p-head{position:sticky;top:0;z-index:2;background:var(--panel-2);display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.p-head h1{font:600 22px/1.2 var(--ui);margin:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-size:15px;min-height:42px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.btn.recording{background:var(--red);border-color:var(--red);color:#fff}
.p-body{max-width:780px;margin:0 auto;padding:10px 16px 60px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.sec h2{font:600 18px/1.3 var(--ui);margin:0 0 4px}
.sec h3{font:600 15px/1.3 system-ui,sans-serif;margin:14px 0 6px;color:var(--muted)}
.sec p.note{margin:0 0 12px;color:var(--muted);font-size:14px;line-height:1.45;max-width:66ch}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-of-type{border-top:0}
.row label,.row > span{font-size:15px}
.row input[type=text]{font-size:17px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:inherit;min-width:0;width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--panel);padding:8px 14px;font-size:15px;min-height:40px}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.step{display:inline-flex;align-items:center;gap:10px}
.step button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:20px}
.step output{min-width:1.5em;text-align:center;font-size:17px;font-weight:600}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);padding:0}
.sw[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:48px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font:700 22px/1 var(--num);padding:0 10px;color:inherit}
.chip[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.toggle{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle:checked{background:var(--ok)}
.toggle:checked::after{left:23px}
.small{font-size:13px;color:var(--muted);line-height:1.45}
.meter{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;background:var(--ok);border-radius:5px}
.prog{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.pt{height:50px;border-radius:8px;display:grid;place-items:center;font:700 20px/1 var(--num);background:var(--panel-2);color:var(--muted);position:relative}
.pt small{position:absolute;bottom:2px;font:500 10px/1 system-ui,sans-serif}
.pt i.bx{position:absolute;top:2px;right:4px;font:600 10px/1 system-ui,sans-serif;font-style:normal;opacity:.85}
.pt.g{background:color-mix(in srgb,var(--ok) 80%,transparent);color:#fff}
.pt.y{background:color-mix(in srgb,var(--yellow) 70%,transparent);color:#1D2B4F}
.pt.r{background:color-mix(in srgb,var(--red) 55%,transparent);color:#fff}
.chrow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start;padding:10px 8px;border-top:1px solid var(--line)}
.chrow.cur{background:color-mix(in srgb,var(--ok) 12%,transparent);border-radius:10px;border-top-color:transparent}
.chrow b{font:600 15px/1.3 system-ui,sans-serif}
.chrow .small{grid-column:1/-1}
.achips{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.achip{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:6px 12px;font-size:13px;min-height:34px;color:inherit}
.rec-tools{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.rec-group h3{display:flex;align-items:center;justify-content:space-between;gap:10px}
.clip{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.has{background:var(--ok)}
.dot.stale{background:var(--yellow)}
.clip .lbl{font-size:15px;line-height:1.3;min-width:0}
.clip .lbl small{display:block;color:var(--muted);font-size:13px}
.clip .lbl code{display:block;font-size:12px;color:var(--muted)}
.clip .acts{display:flex;gap:6px}
.ic{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0;color:inherit}
.ic svg{width:20px;height:20px}
.ic.recording{background:var(--red);border-color:var(--red);color:#fff;animation:breathe 1s infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.status{font-size:14px;color:var(--muted);min-height:1.4em;margin-top:6px;white-space:pre-line;line-height:1.5}
.gmode{position:fixed;inset:0;z-index:60;background:rgba(10,18,32,.55);display:grid;place-items:center;padding:16px}
.gcard{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--panel);border-radius:18px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.ghead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
.gbig{font:700 64px/1.1 var(--num);text-align:center;padding:6px 0 0}
.gbig.txt{font:500 22px/1.35 var(--ui);text-align:left}
.glabel{text-align:center;font-size:16px}
.glabel small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.gwave{width:100%;height:90px;border-radius:10px;background:var(--panel-2)}
.gstatus{font-size:14px;color:var(--muted);min-height:1.3em;text-align:center}
.gacts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.gacts .grec{min-width:120px}

/* held fingers shouldn't scroll, select, or open menus */
.card,.side,.prof,.bigplay,.round-btn,.speak,.caption,.gear{touch-action:none;-webkit-touch-callout:none}
.screen:not(#parent){-webkit-touch-callout:none}
@media (prefers-reduced-motion: reduce){
  .walk .fig .bob,.fig.talk .bob,.card.win,.card.wiggle,.card.hint,.side.hint,.trophy svg,.brawl .dp,.cheer .fig .bob,.gob.run,.gob.hop,.disc .bob,
  .gob.puzzled,.gob.bonked,.messenger.gallop .bob,#things .stone.blank .q{animation:none}
}
</style>
</head>
<body>

<section id="start" class="screen on">
  <div class="logo">
    <svg viewBox="0 0 150 186" aria-hidden="true"><path d="M75 14 Q112 14 138 26 V86 Q138 142 75 170 Q12 142 12 86 V26 Q38 14 75 14 Z" fill="#D5DDEB" transform="translate(0 8)"/><path d="M75 14 Q112 14 138 26 V86 Q138 142 75 170 Q12 142 12 86 V26 Q38 14 75 14 Z" fill="#E5483F"/><path d="M75 26 Q106 26 126 35 V86 Q126 134 75 158 Q24 134 24 86 V35 Q44 26 75 26 Z" fill="#fff"/><text x="75" y="116" text-anchor="middle" font-family="Andika, sans-serif" font-weight="700" font-size="86" fill="#E5483F">3</text></svg>
    <h1>Number Knights</h1>
  </div>
  <button class="bigplay" id="startBtn" aria-label="Start">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
  </button>
  <p class="hint">Turn the sound up, and hold the tablet sideways. Grown-ups: hold the gear on the next screen for settings, the campaign and voice recordings.</p>
</section>

<section id="home" class="screen">
  <div class="topbar">
    <span class="gear-tip" id="gearTip">Keep holding…</span>
    <button class="gear" id="gear" aria-label="Grown-up settings (press and hold)">
      <span class="ring"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68 1.65 1.65 0 0 0 10 3.17V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <div class="profiles" id="profiles"></div>
</section>

<section id="play" class="screen">
  <div id="stage">
    <div id="land"></div>
    <div id="placeWrap"></div>
    <div id="placeNext"></div>
    <div id="party"></div>
    <svg id="things" viewBox="0 0 1180 820" aria-hidden="true"></svg>
    <div id="sides"></div>
    <div id="fx"></div>
    <div id="ui">
      <button class="round-btn" id="homeBtn" aria-label="Back home">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 2.6 11a1 1 0 0 0 1.3 1.5l.6-.5V20a1 1 0 0 0 1 1h4.5v-6h4v6h4.5a1 1 0 0 0 1-1v-8l.6.5A1 1 0 0 0 21.4 11z"/></svg>
      </button>
      <button class="speak" id="speakBtn" aria-label="Hear Buckleberry again">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h12"/><path d="M2 10v4"/><path d="M7 12V9M10 12V9"/><path d="M14 12l7-5v10z" fill="#fff"/><path class="w" d="M22.5 9.5v5" opacity=".8"/></svg>
      </button>

(() => {
  const SEL = ".card, .side, .prof, .bigplay, .round-btn, .speak, .caption";
  let press = null, swallow = null;
  document.addEventListener("pointerdown", e => {
    let el = e.target.closest(SEL);
    if (!el && e.target.closest("#party-screen")) el = document.getElementById("party-screen");
    press = el && !el.closest("#parent") ? {el, id:e.pointerId, x:e.clientX, y:e.clientY} : null;
  }, true);
  document.addEventListener("pointerup", e => {
    if (!press || e.pointerId !== press.id) return;
    const {el, x, y} = press; press = null;
    const r = el.getBoundingClientRect();
    const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;

/* Which nouns the game counts, compares or names, from every task list in the campaign (and the grown-ups' try-it). */
function nounsUsed(){
  const u = {count:new Set(["villagers","chickens"]), more:new Set(["goblins","chickens"]), word:new Set(["villagers","chickens","goblins"])};
  const specs = [T_SKIRM, T_COUNT_GOB, T_BUILD, T_ASSAULT];
  CHAPTERS.forEach(c => { c.stops.forEach(s => specs.push(s.t || [], s.tb || [], s.ta || [])); c.raids.forEach(r => specs.push(r.t)); });
  specs.flat().forEach(([type, nouns]) => (nouns || []).forEach(n => {
    if (type === "count") u.count.add(n);
    if (type === "more" || type === "cmpc") u.more.add(n);
    u.word.add(n);
  }));
  return u;
}

  HERALD.forEach(([k, t, g, hint, tts]) => CLIPS[k] = {role:"herald", group:g, label:`“${t}”`, hint:hint || "", tts:tts ?? t});
  const used = nounsUsed();
  for (const k of Object.keys(NOUNS)) {
    if (used.count.has(k)) CLIPS["how_many_" + k] = {role:"herald", group:"Commands", label:`“How many ${k}?”`, hint:"", tts:`How many ${k}?`};
    if (used.more.has(k)) {
      CLIPS["which_more_" + k] = {role:"herald", group:"Commands", label:`“Which side has more ${k}?”`, hint:"", tts:`Which side has more ${k}?`};
      CLIPS["which_fewer_" + k] = {role:"herald", group:"Commands", label:`“Which side has fewer ${k}?”`, hint:"From level 3.", tts:`Which side has fewer ${k}?`};
    }
    if (used.word.has(k)) CLIPS["w_" + k] = {role:"herald", group:"Words", label:`“${k}”`, hint:"Just the word, after a number: “3… " + k + "!”", tts:k};
  }
  CLIPS.w_soldiers = {role:"herald", group:"Words", label:"“soldiers”", hint:"After a number: “We have… 5… soldiers!”", tts:"soldiers"};
  state.profiles.forEach(p => { if (p.slug) CLIPS["child_" + p.slug] = {role:"herald", group:"Names", label:p.name, hint:"Say it the way you usually do.", tts:p.name}; });
  for (const [k, v] of Object.entries(NARR)) {

const store = {
  db:null,
  open(){ return new Promise(res => { try { const r = indexedDB.open("numberknights", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("clips");
      r.onsuccess = () => { this.db = r.result; res(true); };
      r.onerror = () => res(false); } catch(e) { res(false); } }); },
  tx(mode){ return this.db.transaction("clips", mode).objectStore("clips"); },
  put(k, v){ return new Promise(res => { if (!this.db) return res(false); try { const q = this.tx("readwrite").put(v, k); q.onsuccess = () => res(true); q.onerror = () => res(false); } catch(e) { res(false); } }); },
  del(k){ return new Promise(res => { if (!this.db) return res(false); try { const q = this.tx("readwrite").delete(k); q.onsuccess = () => res(true); q.onerror = () => res(false); } catch(e) { res(false); } }); },
  all(){ return new Promise(res => { const out = new Map(); if (!this.db) return res(out); try {
      const q = this.tx("readonly").openCursor();
      q.onsuccess = () => { const c = q.result; if (c) { out.set(c.key, c.value); c.continue(); } else res(out); };
      q.onerror = () => res(out); } catch(e) { res(out); } }); }
};

  if (!recorded(from) || from === to) return;

let ac = null, voiceOut, sfxOut, musicOut, noiseBuf;
function ensureAudio(){

    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      voiceOut = ac.createGain(); voiceOut.connect(ac.destination);
      sfxOut = ac.createGain(); sfxOut.gain.value = .5; sfxOut.connect(ac.destination);
      musicOut = ac.createGain(); musicOut.gain.value = 0; musicOut.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * .5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

}
function decode(ab){ return new Promise((res, rej) => { const p = ac.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); }); }

let voice = null;
function pickVoice(){
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  const pref = ["Daniel","Arthur","Google UK English Male","Samantha","Google US English","Karen","Moira","Microsoft Ryan","Microsoft Aria"];
  voice = pref.map(n => vs.find(v => v.name.includes(n))).find(Boolean) || vs.find(v => /en-(GB|US)/i.test(v.lang)) || vs[0] || null;
}

function tts(text, gen, vol = 1){
  return new Promise(res => {
    if (!("speechSynthesis" in window) || !text || gen !== speakGen) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = .9; u.pitch = 1.0; u.volume = vol; u.lang = voice ? voice.lang : "en-GB"; if (voice) u.voice = voice;

/** say(["find_banner","num_4"]): the herald. Numbers are pauses (ms). opts.gap between items, opts.onStep(i, key). */
async function say(items, opts = {}){
  stopSpeech(); const gen = speakGen;
  items = items.filter(it => typeof it === "number" || (it && (!CLIPS[it] || CLIPS[it].role !== "narrator")));
  if (!items.length) return true;
  talking(true);
  const gap = opts.gap ?? 70, segs = [];
  const ek = echoing() ? [...items].reverse().find(it => typeof it === "string" && (/^num_/.test(it) || it === "h_hello_echo")) : null;
  const ei = ek ? items.lastIndexOf(ek) : -1;
  items.forEach((it, i) => {
    if (typeof it === "number") return segs.push({wait:it});
    const last = segs[segs.length - 1];
    if (!opts.onStep && !hasClip(it) && last && last.tts !== undefined && !last.echo) { last.tts += ", " + clipText(it); if (i === ei) last.echo = ek; }
    else if (!opts.onStep && !hasClip(it)) segs.push({tts:clipText(it), echo:i === ei ? ek : null});
    else segs.push({key:it, i, echo:i === ei ? ek : null});
  });
  for (const s of segs) {
    if (gen !== speakGen) return false;
    if (s.wait) { await wait(s.wait); continue; }
    if (opts.onStep && s.i !== undefined) opts.onStep(s.i, s.key);
    if (s.key) await playClip(s.key, gen); else await tts(s.tts, gen);
    if (gen !== speakGen) return false;
    if (s.echo) { await echo(s.echo, gen); if (gen !== speakGen) return false; }
    await wait(gap);

}

let musicTimer = null, musicStep = 0, musicNext = 0;
const TUNE = [67,0,72,0,72,74,76,0,74,0,72,0,71,0,69,67, 67,0,72,0,72,74,76,79,77,0,76,74,72,0,0,0];

  if (!ac || musicTimer || !state.music) return;
  musicOut.gain.setTargetAtTime(.05, ac.currentTime, .5);
  musicNext = ac.currentTime + .1;
  musicTimer = setInterval(() => {
    while (musicNext < ac.currentTime + .3) {

      if (n) { const o = ac.createOscillator(), g = ac.createGain(); o.type = "triangle"; o.frequency.value = 440 * Math.pow(2, (n - 69) / 12);
        g.gain.setValueAtTime(.0001, musicNext); g.gain.exponentialRampToValueAtTime(.45, musicNext + .01); g.gain.exponentialRampToValueAtTime(.0001, musicNext + .5);
        o.connect(g); g.connect(musicOut); o.start(musicNext); o.stop(musicNext + .6); }

        g.gain.setValueAtTime(.8, musicNext); g.gain.exponentialRampToValueAtTime(.0001, musicNext + .12); s.connect(f); f.connect(g); g.connect(musicOut); s.start(musicNext); s.stop(musicNext + .15); }

/* ================= screens ================= */
function show(id){ $$(".screen").forEach(s => s.classList.toggle("on", s.id === id)); if (id === "play") fitStage(); }
/* The stage is 1180 × 820, scaled to fit and centred. The scenery runs on past its sides to the edges of the screen;
   G.edge is where those edges are, in stage pixels. */
function fitStage(){
  const W = $("#play").clientWidth || innerWidth, H = $("#play").clientHeight || innerHeight, s = Math.min(W / 1180, H / 820);
  const ox = (W - 1180 * s) / 2, oy = (H - 820 * s) / 2;
  $("#stage").style.transform = `translate(${ox}px, ${oy}px) scale(${s})`;
  G.edge = {left:-ox / s, right:1180 + ox / s, top:-oy / s, bottom:820 + oy / s};
  $("#stage").style.setProperty("--ex", ox / s + "px");
}
window.addEventListener("resize", fitStage);
/* nothing inside the stage may scroll it (a focused button would otherwise pull the scene sideways) */
["#play", "#stage"].forEach(s => $(s).addEventListener("scroll", e => { e.target.scrollLeft = 0; e.target.scrollTop = 0; }));

const ABORT = {abort:true};
const G = {session:0, busy:true, edge:{left:0, right:1180, top:0, bottom:820}, hearing:false, task:null, resolve:null, misses:0, step:0, readyAt:0, rapid:0, repeatTimer:null, repeats:0,
  prompt:[], asked:{}, recent:{n:[], q:[]}, steps:0, firstSteps:0, stopsThisSitting:0, sittings:0, locked:false, practice:null, landX:0, lastType:null};
const guard$ = () => { const s = G.session; return () => { if (G.session !== s) throw ABORT; }; };
const run = p => p.catch(e => { if (e !== ABORT) console.error(e); });
const arcNow = () => G.practice ? (G.practice.level >= 5 ? 2 : 1) : arcOf(P.ch);
const setSize = () => state.setSize || (arcNow() >= 2 ? 4 : 3);   // 3 tasks per stop in arc 1, 4 in arc 2
/* The level being played: each arc tops out at its own level (the child can be one above it, ready for the next arc). */
const levelNow = () => Math.max(1, G.practice ? Math.min(MAX_LEVEL, G.practice.level) : Math.min(ARC_TOP[arcOf(P.ch)], P.level));
const LV = () => LEVELS[levelNow()];

/* ================= landscape, march, places ================= */
const PARALLAX = {far:.3, near:.6, ground:1};
let landName = null;
function renderLand(name){
  landName = name;
  const L = landLayers(name);
  $("#land").innerHTML = Object.keys(PARALLAX).map(k => `<div class="lay" data-l="${k}"><svg width="5900" height="820" viewBox="-1180 0 5900 820" overflow="visible">${L[k]}</svg></div>`).join("");
  $("#play").style.background = L.sky; document.body.style.setProperty("--sky", L.sky); document.body.style.setProperty("--ground", L.fg);
  $$(".lay").forEach(el => el.style.transform = "translateX(0px)"); G.lay = {far:0, near:0, ground:0};
}
function placeHTML(id, extra = ""){
  const pl = PLACES[id] ? PLACES[id]() : {svg:""};
  return {pl, html:`<svg class="pl" viewBox="0 0 620 460" width="620" height="460" overflow="visible"><g class="pl-body">${pl.svg}</g><g id="ladders"></g><g id="ram"></g><g id="sp"></g>${extra}<g id="guards"></g></svg>`};

function setPlace(id, {guards = 0, pot = false} = {}){
  const {pl, html} = placeHTML(id);

  if (guards) addGuards(guards, pot || pl.pot);

function confetti(){

async function runVillage(stop){

}
async function runSkirmish(spec, arriveLine, wonLine, {raid = false} = {}){
  const ck = guard$();
  await narrate(arriveLine); ck();
  const trolls = arcNow() >= 2;
  if (trolls && !P.metTrolls) { await say(["h_troll_first", ...heroKeys(), "h_show_clever"]); P.metTrolls = true; save(); }
  else if (!trolls && !P.metGoblins) { await say(["h_goblins_first", ...heroKeys(), "h_show_clever"]); P.metGoblins = true; save(); }
  else if (!raid) await say([trolls ? "h_trolls" : "h_goblins"]);
  ck();
  for (;;) {
    const first = await runSet(spec, i => dropStick(i)); ck();
    const won = first * 2 >= setSize();
    await battle(won); ck();
    if (won) break;
  }
  await say([trolls ? "h_stomped_away" : "h_ran_away"]); ck();
  if (wonLine) { await narrate(wonLine); ck(); }
}

async function runSiege(stop){
  const ck = guard$();
  await narrate(stop.arrive); ck();
  await say([stop.need]); ck();
  const S = {ladders:0, ram:0}, minL = stop.minLadders || 2, TB = stop.tb || T_BUILD, TA = stop.ta || T_ASSAULT;
  for (const part of stop.build) {
    if (part === "ladders") {
      while (S.ladders < minL) {
        const before = S.ladders;
        await runSet(TB, async () => addLadder(S)); ck();
        if (S.ladders === before) addLadder(S);
        if (S.ladders < minL) { await say(["h_one_more_ladder"]); ck(); }
      }
    } else if (part === "ram") {
      await say(["h_need_ram"]); ck();
      while (S.ram < 2) {
        const before = S.ram;
        await runSet(TB, async () => { addRam(S); await say(["h_ram_part"]); }); ck();
        if (S.ram === before) addRam(S);
        if (S.ram < 2) { await say(["h_ram_more"]); ck(); }
      }
    }
  }
  await say([stop.build.includes("ram") ? "h_ram_ready" : "h_up_the_ladders"]); ck();
  addGuards(G.foes || 4, PL.pot);
  for (;;) {
    const first = await runSet(TA, i => dropStick(i)); ck();
    const won = first * 2 >= setSize();
    if (won && S.ram) {                                      // BOOM… BOOM… CRASH! and the gate falls flat
      const r = $("#ram");
      for (let k = 0; k < 3; k++) { r.animate([{transform:"translateX(0)"}, {transform:"translateX(30px)"}, {transform:"translateX(0)"}], {duration:420 * SPEED}); SFX.boom(); await wait(460); ck(); }
      const gate = $("#placeWrap .gate"); if (gate) { gate.style.transformBox = "fill-box"; gate.style.transformOrigin = "50% 100%"; gate.style.transition = `transform ${.5 * SPEED}s ease-in`; gate.style.transform = "scaleY(.06)"; }
    }
    await battle(won, {fort:true}); ck();
    if (won) break;
  }
  await say([stop.wonH || "h_fort_ours"]); ck();
  for (const k of [].concat(stop.won)) { await narrate(k); ck(); }
}
function addLadder(S){
  const spot = (PL.ladders || [])[S.ladders]; S.ladders++;
  if (!spot) return;
  $("#ladders").insertAdjacentHTML("beforeend", `<g transform="translate(${spot[0]} ${spot[1]})"><g class="flagup">${LADDER}</g></g>`);
  SFX.pop(); say(["h_a_ladder"]);
}
function addRam(S){
  S.ram = Math.min(4, S.ram + 1);
  const [x, y] = PL.ram || [310, GY];
  $("#ram").setAttribute("transform", `translate(${x - 150} ${y})`); $("#ram").innerHTML = ramSVG(S.ram);
  SFX.pop();
}

/* ================= a sitting: march from stop to stop until camp ================= */
function sceneFor(){ const ch = CHAPTERS[P.ch]; renderLand(ch.land); renderParty(); renderRoad(); hideTask(); $("#placeWrap").innerHTML = ""; $("#fx").innerHTML = ""; $("#pips").innerHTML = ""; $("#marchBtn").hidden = true; $("#placeWrap").classList.remove("camp"); }
const canAdvance = () => P.ch + 1 < CHAPTERS.length && P.level >= CHAPTERS[P.ch + 1].level;
async function openChapter(){
  const ck = guard$(), ch = CHAPTERS[P.ch];
  if (ch.prologue) {
    setPlace("castle");
    for (const k of ch.open) {
      if (k === "st1_1_02") { const sh = $("#placeWrap .ship"); if (sh) { sh.style.transition = `transform ${4 * SPEED}s ease-in`; sh.style.transform = "translateX(260px)"; } }
      if (k === "st1_1_03") { const s = $("#placeWrap .steward"); if (s) s.style.opacity = 1; }
      await narrate(k); ck();
    }
    await say(["h_intro", ...heroKeys()]); ck();
  } else {
    $("#placeWrap").innerHTML = "";
    for (const k of ch.open) { await narrate(k); ck(); }
  }
  P.seenOpen[ch.n] = true; save();
  await say(ch.openH || ["h_forward_march"]); ck();
}
async function sitting(){
  const ck = guard$();
  G.stopsThisSitting = 0; G.asked = {};
  sceneFor();
  await wait(400); ck();
  if (!P.blocked && !P.seenOpen[CHAPTERS[P.ch].n] && P.stop === 0) { await openChapter(); ck(); }
  else if (P.camped) { await narrate("st_morning"); ck(); await say(["h_wake_up"]); ck(); }
  P.camped = false; save();
  // Every stop is won but the chapter's celebration was cut short (the game was left during it): finish it now.
  if (!P.blocked && P.stop >= CHAPTERS[P.ch].stops.length) { await chapterEnd(); ck(); return makeCamp(); }
  let toldBlocked = false;
  for (;;) {
    if (G.stopsThisSitting >= state.campAfter) return makeCamp();
    if (P.blocked) {
      if (canAdvance()) {
        const ch = CHAPTERS[P.ch];
        $("#placeWrap").innerHTML = `<svg viewBox="0 0 620 460" width="620" height="460" overflow="visible">${BLOCKS[ch.n] || ""}</svg>`;
        if (ch.cleared) { await narrate(ch.cleared); ck(); }
        await say(["h_road_clear"]); ck();
        P.ch++; P.stop = 0; P.blocked = false; save();
        await marchTo(null); ck();
        renderLand(CHAPTERS[P.ch].land); renderRoad();
        await openChapter(); ck();
        continue;
      }
      if (!toldBlocked) {
        toldBlocked = true;
        $("#placeWrap").innerHTML = `<svg viewBox="0 0 620 460" width="620" height="460" overflow="visible">${BLOCKS[CHAPTERS[P.ch].n] || ""}</svg>`;
        await narrate(CHAPTERS[P.ch].blocked); ck(); await say(["h_road_blocked"]); ck();
      }
      await runRaid(); ck();
      G.stopsThisSitting++;
      continue;
    }
    const ch = CHAPTERS[P.ch], stop = ch.stops[P.stop];
    renderRoad();
    await say([P.stop === 0 && G.stopsThisSitting === 0 ? "h_forward_march" : "h_onward"]); ck();
    const skirm = stop.kind === "skirmish";
    await marchTo(stop.place, {guards:skirm ? foesFor("skirmish") : stop.kind === "siege" ? foesFor("siege") : 0}); ck();
    if (stop.kind === "village") await runVillage(stop);
    else if (skirm) await runSkirmish(stop.t, stop.arrive, stop.won);
    else if (stop.kind === "special") await runSpecial(stop);
    else await runSiege(stop);
    ck();
    if (stop.kind !== "siege" && !P.freed.includes(stop.id)) P.freed.push(stop.id);
    P.stop++; G.stopsThisSitting++; save(); renderRoad();
    if (P.stop >= ch.stops.length) { await chapterEnd(); ck(); return makeCamp(); }
  }
}
async function runRaid(){
  const ck = guard$();
  // after an arc's finale, raids come from any village in the whole arc
  const arc = arcOf(P.ch), chs = P.arcsDone.includes(arc) ? CHAPTERS.filter(c => c.arc === arc) : [CHAPTERS[P.ch]];
  const raids = chs.flatMap(c => c.raids).filter(r => P.freed.includes(r.at));
  const list = raids.length ? raids : chs[0].raids;
  const r = list[P.raidIdx % list.length]; P.raidIdx++; save();
  const where = STOP_BY_ID[r.at];
  await say([arc >= 2 ? "h_raid_trolls" : "h_raid"]); ck();
  if (landName !== CHAPTERS[where.ci].land) renderLand(CHAPTERS[where.ci].land);
  await marchTo(where.place, {guards:foesFor("skirmish")}); ck();
  await runSkirmish(r.t, r.line, null, {raid:true}); ck();

  await giveTreasure(nextTreasure()); ck();
}

/* ================= step-by-step recording ================= */
let guide = null;   // {role, group, keys, i}
function openGuide(role, group){
  ensureAudio();
  let keys = Object.keys(CLIPS).filter(k => CLIPS[k].role === role && CLIPS[k].group === group);
  if (recFilter === "missing") { const miss = keys.filter(k => !hasClip(k)); if (miss.length) keys = miss; }
  guide = {role, group, keys, i:0}; renderGuide();
}
function renderGuide(){
  let boxEl = $("#guideBox");
  if (!guide) { if (boxEl) boxEl.remove(); return; }
  if (!boxEl) { boxEl = document.createElement("div"); boxEl.id = "guideBox"; boxEl.className = "gmode"; $("#parent").appendChild(boxEl); }
  const k = guide.keys[guide.i], c = CLIPS[k], last = guide.i >= guide.keys.length - 1, narr = c.role === "narrator";
  boxEl.innerHTML = `<div class="gcard" role="dialog" aria-modal="true" aria-label="Record step by step">
    <div class="ghead"><span>${esc(guide.group)} · ${guide.i + 1} of ${guide.keys.length}</span><button class="ic" data-g="close" aria-label="Close">${ICON.del}</button></div>
    <div class="gbig${narr || !c.big ? " txt" : ""}">${narr ? esc(narrText(k)) : c.big ? esc(c.big) : esc(c.label)}</div>
    <div class="glabel">${narr ? "Read it like a storybook." : esc(c.hint || "")}<small><code>${k}</code></small></div>
    <canvas class="gwave" id="gWave" width="600" height="90" aria-label="Picture of the recording"></canvas>
    <div class="gstatus" id="gStatus">${hasClip(k) ? "Recorded. Play it back, or record it again." : narr ? "Not recorded yet: the caption shows, silently." : "Not recorded yet: the robot voice fills in."}</div>
    <div class="gacts">
      <button class="btn" data-g="prev" ${guide.i ? "" : "disabled"}>Back</button>
      <button class="btn" data-g="play">${hasClip(k) ? "Play" : narr ? "Play" : "Hear robot"}</button>
      ${MIC_OK ? `<button class="btn primary grec" data-g="rec">Record</button>` : `<button class="btn primary" data-g="file">Import a file</button>`}
      <button class="btn" data-g="next">${last ? "Finish" : "Next"}</button>
    </div></div>`;
  drawWave(k);
}
async function drawWave(k){
  const cv = $("#gWave"); if (!cv) return;
  const g = cv.getContext("2d"), W = cv.width, H = cv.height;
  g.clearRect(0, 0, W, H); g.fillStyle = "#DCE3EE"; g.fillRect(0, H / 2 - .5, W, 1);
  const buf = recorded(k) ? await getBuffer(k) : null;
  if (!buf || !cv.isConnected) return;
  const d = buf.getChannelData(0), step = Math.max(1, Math.floor(d.length / W));
  g.fillStyle = "#2E78D0";
  for (let x = 0; x < W; x++) {
    let lo = 1, hi = -1;
    for (let i = x * step, e = Math.min(d.length, i + step); i < e; i++) { const v = d[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
    if (hi < lo) continue;
    g.fillRect(x, H / 2 - hi * H * .46, 1, Math.max(1, (hi - lo) * H * .46));
  }
}
$("#parent").addEventListener("click", async e => {
  const b = e.target.closest("[data-g]"); if (!b || !guide) return;
  const k = guide.keys[guide.i], a = b.dataset.g, st = $("#gStatus");
  if (a === "close") { if (rec) rec.stop(); guide = null; renderGuide(); renderParent(); return; }
  if (a === "prev" || a === "next") {
    if (rec) return;
    if (a === "next" && guide.i >= guide.keys.length - 1) { guide = null; renderGuide(); renderParent(); return; }
    guide.i += a === "next" ? 1 : -1; renderGuide(); return;
  }
  if (a === "play") { ensureAudio(); playAny(k); return; }
  if (a === "file") { importOneKey = k; $("#fileOne").click(); return; }
  if (a === "rec") {
    if (rec && recKey === k) { rec.stop(); return; }
    if (rec || b.dataset.counting) return;
    b.dataset.counting = "1"; stopSpeech();
    for (const n of ["3", "2", "1"]) { b.textContent = n; st.textContent = "Get ready…"; await wait(550); if (!b.isConnected) return; }
    delete b.dataset.counting; b.textContent = "Stop"; st.textContent = "Recording… say it once, then tap Stop.";

  }
});
